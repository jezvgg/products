services:
  app:
    build: .
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-products}
      MCP_TOKEN: ${MCP_TOKEN:?MCP_TOKEN must be set in .env}
      UI_PASSWORD: ${UI_PASSWORD:?UI_PASSWORD must be set in .env}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    networks:
      - internal

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' localhost:27017/test | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  internal:
    internal: true

volumes:
  mongo_data:
