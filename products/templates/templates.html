{% extends 'base.html' %}
{% block content %}
<h1>Templates</h1>
<a class="button" href="/templates/new">New template</a>
<ul class="cards">
  {% for template in templates %}
    <li><span>{{ template.name }}</span>{% if template.name != 'Пустая карточка' %}<span><a href="/templates/{{ template.id }}/edit">Edit</a></span>{% endif %}</li>
  {% endfor %}
</ul>
{% endblock %}
