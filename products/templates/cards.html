{% extends 'base.html' %}{% block content %}<h1>Cards</h1><form class="filters"><input name="q" value="{{ query }}" placeholder="Search title"><select name="template_id"><option value="">All templates</option>{% for t in templates %}<option value="{{t.id}}" {% if t.id==selected %}selected{% endif %}>{{t.name}}</option>{% endfor %}</select><button>Filter</button></form><ul class="cards">{% for c in cards %}<li><a href="/cards/{{c.id}}/edit">{{c.title}}</a></li>{% else %}<li>No cards</li>{% endfor %}</ul>{% if next_cursor %}<a class="button" href="?q={{query|urlencode}}&template_id={{selected}}&cursor={{next_cursor|urlencode}}">More</a>{% endif %}{% endblock %}
