<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cards{% endblock %} · Products</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header class="topbar">
      <nav class="nav">
        <a class="brand" href="/cards">Products</a>
        <a class="nav-link{% if request.url.path.startswith('/cards') %} is-active{% endif %}" href="/cards">Cards</a>
        <a class="nav-link{% if request.url.path.startswith('/templates') %} is-active{% endif %}" href="/templates">Templates</a>
        <a class="button button-primary nav-action" href="/cards/new">Add</a>
        <a class="nav-link nav-logout" href="/logout">Log out</a>
      </nav>
    </header>

    <main class="page">
      {% block content %}{% endblock %}
    </main>

    <script src="/static/app.js" defer></script>
  </body>
</html>
